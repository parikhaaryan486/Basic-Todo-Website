<!DOCTYPE html>
<html>
<head>
    <title>AWS To-Do Application</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 8px; margin-right: 10px; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #eee; margin-top: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AWS Cloud Practical - To-Do List</h2>
        <form action="/add" method="POST">
            <input type="text" name="title" placeholder="Enter new task..." required>
            <button type="submit">Add Task</button>
        </form>
        <h3>Tasks:</h3>
        <ul>
            {% for todo in todos %}
                <li>
                    <span>{{ todo.title }}</span>
                    <form action="/delete/{{ todo.todo_id }}" method="POST" style="margin:0;">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
